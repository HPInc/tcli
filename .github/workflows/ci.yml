name: tcli ci
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Run sanity tests
      run: make sanity

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}

    - name: Tag and push image
      env:
        IMAGE: ghcr.io/${{ github.repository_owner }}/tcli
      run: |
        docker tag tcli "$IMAGE:v0.0.4"
        docker push "$IMAGE:v0.0.4"

    - name: Cleanup
      if: always()
      run: make ci_clean
