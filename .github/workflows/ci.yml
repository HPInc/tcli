name: tcli ci
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run sanity tests
      run: make sanity

    - name: Cleanup
      if: always()
      run: make ci_clean
