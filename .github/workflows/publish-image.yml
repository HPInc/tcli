name: publish docker image

# Publishing has its own validation gates; the separate CI workflow is not a dependency.
on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release and resolve tcli version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: bash tools/resolve_image_version.sh "$REF_TYPE" "$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests and lint
        run: make test lint

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.version.outputs.stable == 'true' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.version.outputs.major_alias == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable == 'true' }}
            type=edge,branch=main
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/Dockerfile
          load: true
          push: false
          build-args: |
            TCLI_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify candidate version
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          actual=$(docker run --rm -e TCLI_CONFIG_ROOT=/missing-config "$IMAGE_ID" version)
          if [[ "$actual" != "$EXPECTED_VERSION" ]]; then
            echo "Image version mismatch: expected $EXPECTED_VERSION, got $actual" >&2
            exit 1
          fi

      - name: Scan candidate image
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy image \
            --severity HIGH,CRITICAL,MEDIUM,LOW --exit-code 1 "$IMAGE_ID"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push validated image tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$TAGS"
